name: schema-and-docs-check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate schema + documentation coverage
        run: python scripts/validate_repo.py --repo .

      - name: Validate CSV files are readable
        run: |
          python - <<'PY'
          import csv, pathlib, sys
          bad = []
          for p in sorted(pathlib.Path("data").glob("*.csv")):
              try:
                  rows = list(csv.reader(p.open(encoding="utf-8")))
              except Exception as exc:
                  bad.append(f"{p}: {exc}")
                  continue
              if not rows:
                  bad.append(f"{p}: empty")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("data csv ok")
          PY
